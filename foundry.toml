[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
verbosity = 2

[fuzz]
runs = 256

[lint]
# Events are emitted after successful external calls; all entry points are nonReentrant.
exclude_lints = ["reentrancy-events"]

[rpc_endpoints]
kub_testnet = "https://rpc-testnet.kubchain.io"
kub_mainnet = "https://rpc.kubchain.io"
